services:
  - type: web
    name: chatflow-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm exec prisma generate -- --schema=prisma/schema.prisma && npm exec prisma db push -- --accept-data-loss --schema=prisma/schema.prisma && npm run build --workspace=server
    startCommand: npm run start --workspace=server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVER_HOST
        value: 0.0.0.0
      - key: SERVER_PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: chatflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 15m
      - key: SOCKET_IO_CORS_ORIGIN
        sync: false

databases:
  - name: chatflow-db
    plan: free